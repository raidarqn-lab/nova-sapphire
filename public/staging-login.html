<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova Sapphire · Account testing</title><link rel="stylesheet" href="./style.css"><style>[hidden]{display:none!important}main{max-width:520px;margin:64px auto;padding:24px}label{display:grid;gap:8px;margin:18px 0}input{padding:12px;width:100%}nav{display:flex;gap:12px;flex-wrap:wrap}#codes{overflow-wrap:anywhere;padding:16px;border:1px solid #27dde8}button{margin:8px 0}</style></head><body><main class="panel"><p class="eyebrow">NOVA SAPPHIRE · STAGING</p><h1>Member access</h1><p>Account testing only. This does not save to the live Portal.</p><p id="status" role="status"></p><nav aria-label="Account action"><button data-mode="login">Sign in</button><button data-mode="register">Use invitation</button><button data-mode="recover">Use backup code</button></nav><form id="account-form"><label>Username<input name="username" autocomplete="username" pattern="[A-Za-z0-9_]{3,32}" required></label><label id="code-label" hidden>Private code<input name="code" autocomplete="off" maxlength="64"></label><label>Password<input name="password" type="password" minlength="12" maxlength="128" autocomplete="current-password" required></label><button id="submit" type="submit">Sign in</button></form><section id="codes" hidden><h2>Save your new backup code</h2><p>Keep it privately. It works once and replaces your previous code.</p><code></code><p>After saving it, sign in with your username and password.</p><button id="saved">I saved my code</button></section><section id="member" hidden><h2>Account connected</h2><p id="identity"></p><p id="player"></p><button id="logout">Sign out</button></section><a href="./index.html">Back to Nova Sapphire</a><script type="module" src="./staging-login.js"></script></main></body></html>
